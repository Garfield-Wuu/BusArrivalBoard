[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-arrival-board"
version = "0.1.0"
description = "Real-time bus arrival information display system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Garfield Wu", email = "wu_garfield@163.com" }]
keywords = ["bus", "transit", "realtime", "esp32", "eink", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 上游要求 Accept-Encoding 含 br（该请求头是服务端指纹校验的一部分，
    # 不能简化），因此 brotli 解码能力是硬依赖：缺少它会拿到无法解码的乱码字节。
    "requests>=2.31.0",
    "brotli>=1.0.9",
    "cryptography>=41.0.0",
    "PyYAML>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# 蓝牙墨水屏显示（nRF51/nRF52 + EPD-nRF5 固件）
epd = ["bleak>=0.21.0", "pillow>=10.0.0"]
# HTTP 帧服务端（供 ESP32 等联网设备拉取画面）
server = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "pillow>=10.0.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    # dev 环境需要 epd/server 依赖才能跑对应模块的测试
    "bleak>=0.21.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]
all = ["bus-arrival-board[epd,server]"]

[project.urls]
Homepage = "https://github.com/Garfield-Wuu/BusArrivalBoard"
Issues = "https://github.com/Garfield-Wuu/BusArrivalBoard/issues"

[project.scripts]
bus-arrival = "bus_arrival_board.cli:main"

[tool.setuptools]
packages = ["chelaile_sdk", "bus_arrival_board", "bus_arrival_board.epd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "network: 需要真实网络的集成测试（默认跳过）",
    "hardware: 需要真实墨水屏硬件的测试（默认跳过）",
]
# 异步测试自动识别，无需每个用例加 @pytest.mark.asyncio 的 loop 配置
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
ignore_missing_imports = true
